<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Spice Street - Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=15">
  <link rel="stylesheet" href="/styles.css?v=15">
</head>
<body class="admin-page">
  <header class="topbar admin-topbar">
    <div>
      <p class="eyebrow">RESTAURANT ADMIN</p>
      <h1>Spice Street</h1>
      <p class="sub">Manage availability & menu pricing</p>
    </div>
    <div class="top-actions"><a class="admin-link" href="/customer/">Customer View</a><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme"></button></div>
  </header>
  <section id="adminLogin" class="login-screen"><div class="login-card"><div class="login-logo">🍽️</div><p class="eyebrow">SPICE STREET</p><h2>Restaurant Admin</h2><p class="login-sub">Sign in to manage today’s menu availability.</p><form id="loginForm"><label>Username<input id="loginUsername" type="text" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="login-btn" type="submit">Sign in</button><p id="loginError" class="login-error" role="alert"></p></form></div></section><main id="adminApp" class="container admin-container" hidden>
    <section id="syncPanel" class="sync-panel">
      <div class="sync-row">
        <span id="syncDot" class="sync-dot off" aria-hidden="true"></span>
        <div class="sync-text" aria-live="polite">
          <strong id="syncTitle">Checking menu update…</strong>
          <span id="syncDetail">Price and availability changes publish automatically.</span>
        </div>
        <div class="sync-actions">
          <button id="syncRetryBtn" class="sync-btn primary" type="button" hidden>Retry</button>
        </div>
      </div>
    </section>
    <section class="admin-summary">
      <div><strong id="availableCount">0</strong><span>Available</span></div>
      <div><strong id="soldOutCount">0</strong><span>Sold out</span></div>
      <button id="resetBtn" class="secondary-btn">Reset All</button>
    </section>
    <section id="adminMenu" class="admin-list"></section>
  </main>
  <script src="/app.js?v=16"></script>
</body>
</html>
