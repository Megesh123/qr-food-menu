<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found - Spice Street</title>
  <!-- GitHub Pages serves this file for any unknown path, at any depth, so the
       asset URLs below have to be root-relative. The page deliberately uses the
       shared stylesheet instead of duplicating it inline, so it cannot drift
       from the rest of the site (and still renders as plain text if it fails). -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=15">
  <link rel="stylesheet" href="/styles.css?v=15">
</head>
<body>
  <main class="container notfound-card">
    <p class="eyebrow">ERROR 404</p>
    <p class="big" aria-hidden="true">🍽️</p>
    <h1>This page isn’t on the menu</h1>
    <p class="notfound-text">The link may have been typed incorrectly, or the QR code you scanned points to an older address. Today’s menu is always available at the link below.</p>
    <div class="notfound-actions">
      <a class="primary-btn" href="/">Go to the home page</a>
      <a class="secondary-link" href="/customer">Open today’s menu →</a>
    </div>
  </main>
  <!-- Applies the visitor's saved light/dark theme. boot() returns early here
       because this page has neither #menu nor the admin dashboard. -->
  <script src="/app.js?v=15"></script>
</body>
</html>
