<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spice Street - Digital Menu</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DIGITAL MENU</p>
      <h1>Spice Street</h1>
      <p class="sub">Fresh food • Updated live</p>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <div><span class="status-dot"></span><strong>Today's menu</strong></div>
      <p>Choose a category and check live availability before ordering.</p>
    </section>
    <div class="legend">
      <span><i class="available"></i> Available</span>
      <span><i class="unavailable"></i> Sold out</span>
    </div>
    <section id="menu" class="menu-sections"></section>
  </main>
  <footer><p>Scan • Choose • Enjoy</p><small>Powered by your digital menu</small></footer>
  <script src="app.js?v=4"></script>
</body>
</html>
